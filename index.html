<!DOCTYPE html>
<html>
<head>
    
    <title>CSS</title>
</head>
<body>
    <style>
        .btn-1{
    background-color:lightpink;
    border: none;
    padding: 10px 20px;
    border-radius:50px 30px 0px 30px; 
    cursor:pointer;
    box-shadow:2px 2px  4px black;
    }
    .btn-1:hover{
        background-color:rgb(226, 97, 119);
        box-shadow:2px 2px 4px rgb(10, 10, 10);
        color:white;
        transition:1s;
    }

    .btn-2{
    background-color:rgb(206, 206, 55);
    border: none;
    padding: 10px; 20px;
    border-radius:35px 45px 55px 65px;
    cursor:pointer;
    box-shadow:2px 2px 4px black;
    }
    .btn-2:hover{
        background-color:rgb(175, 175, 46)
        box-shadow:2px 2px 2px rgb(13,14,14);
        color:white;
        transition:2s;
    }

    .btn-3{
    background-color: rgb(71, 135, 156);
    border: none;
    padding: 30px 30px;
    border-radius:35px 20px 30px 20px;
    cursor:pointer;
    box-shadow:2px 2px 4px black;
    }
    .btn-3:hover{
        background-color:rgb(118, 112, 113)
        box-shadow:2px 2px 2px rgb(13,14,14);
        color:white;
        transition:3s;
    }
    
        .btn-4{
    background-color: rgb(62, 217, 217);
    border: none;
    padding: 30px 30px;
    border-radius:35px 0px 30px 0px;
    cursor:pointer;
    box-shadow:2px 2px 4px black;
    }
    .btn-4:hover{
        background-color:rgb(16, 161, 210);
        box-shadow:4px 4px 5px rgb(13,14,14);
        color:white;
        transition:1s;
    }


    </style>
</body>
   <button class="btn-1">Click Me</button>&nbsp;&nbsp;
      <button class="btn-2">Click Me</button>&nbsp;&nbsp;
       <button class="btn-3">Click Me</button>&nbsp;&nbsp;
        <button class="btn-4">Click Me</button>&nbsp;&nbsp;
</html>
